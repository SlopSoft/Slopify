name: slopify-dev

services:
  api:
    build:
      context: .
      target: dev
    init: true
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      SLOPIFY_LIBRARY_DIR: /library
      SLOPIFY_DOWNLOAD_DIR: /downloads
      SLOPIFY_DOWNLOADER_ENDPOINT: http://downloader:50051
      SLOPIFY_LISTEN_ADDR: 0.0.0.0:8067
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SLOPIFY_DEV_PORT:-8068}:8067"
    volumes:
      - "${SLOPIFY_LIBRARY_DIR:-../library}:/library:ro"
      - downloads_data:/downloads
    networks: [default, downloader]
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /build/src
        - action: sync+restart
          path: ./migrations
          target: /build/migrations
        - action: sync+restart
          path: ./proto
          target: /build/proto
        - action: sync+restart
          path: ./build.rs
          target: /build/build.rs
        - action: rebuild
          path: ./Cargo.toml
        - action: rebuild
          path: ./Cargo.lock
        - action: rebuild
          path: ./Dockerfile

  downloader:
    build:
      context: .
      dockerfile: downloader/Dockerfile
    init: true
    read_only: true
    environment:
      SLOPIFY_YOUTUBE_PROXY: "${SLOPIFY_YOUTUBE_PROXY:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=192m,mode=1777
    networks: [downloader]
    develop:
      watch:
        - action: rebuild
          path: ./downloader
        - action: rebuild
          path: ./proto

  postgres:
    image: postgres:18-alpine
    command: ["postgres", "-c", "config_file=/etc/slopify/postgresql.conf"]
    environment:
      POSTGRES_DB: slopify
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./dev/postgres:/etc/slopify:ro
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres, -d, slopify]
      interval: 5s
      timeout: 3s
      retries: 12
    develop:
      watch:
        - action: restart
          path: ./dev/postgres

  pgadmin:
    image: dpage/pgadmin4:9.19
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_password
      PGADMIN_DISABLE_POSTFIX: "1"
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0
      PGADMIN_LISTEN_PORT: "8080"
    secrets:
      - pgadmin_password
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:8080"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./dev/pgadmin:/etc/pgadmin:ro
    healthcheck:
      test: [CMD, /venv/bin/python3, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/misc/ping', timeout=2).close()"]
      start_period: 30s
      interval: 5s
      timeout: 3s
      retries: 18
    develop:
      watch:
        - action: restart
          path: ./dev/pgadmin

secrets:
  postgres_password:
    environment: POSTGRES_PASSWORD
  pgadmin_password:
    environment: PGADMIN_PASSWORD

volumes:
  postgres_data:
  pgadmin_data:
  downloads_data:

networks:
  downloader:
