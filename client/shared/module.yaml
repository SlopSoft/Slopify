product:
  type: kmp/lib
  platforms: [ jvm, android ]

dependencies:
  - $libs.ktor.client.core
  - $libs.kotlinx.serialization.json
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose

dependencies@jvm:
  - $libs.ktor.client.java
  - $libs.gstreamer.java

dependencies@android:
  - $libs.ktor.client.android
  - $compose.uiTooling

settings:
  compose:
    enabled: true
    resources:
      packageName: slopsoft.slopify.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
