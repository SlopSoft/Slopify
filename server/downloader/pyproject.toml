[project]
name = "slopify-downloader"
version = "0.1.0"
requires-python = ">=3.15,<3.16"
dependencies = [
    "grpcio>=1.85.4,<2",
    "protobuf",
    "yt-dlp",
    "yt-dlp-ejs",
]

[dependency-groups]
build = ["grpcio-tools>=1.85.4,<2"]
dev = ["ruff"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
