[package]
name = "slopify-server"
version = "0.1.0"
edition = "2024"

[features]
swagger = ["dep:utoipa-swagger-ui"]

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
sqlx = { version = "0.9", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
utoipa-swagger-ui = { version = "10", optional = true, default-features = false, features = ["axum", "vendored"] }
