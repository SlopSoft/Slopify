name: Server CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Clippy
        run: rustup component add clippy --toolchain stable

      - name: Run Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings
