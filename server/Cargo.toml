[package]
name = "slopify-server"
version = "0.1.0"
edition = "2024"

[features]
swagger = ["dep:utoipa-swagger-ui"]

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
prost = "0.14"
sqlx = { version = "0.9", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen"] }
tonic-prost = "0.14"
utoipa-swagger-ui = { version = "10", optional = true, default-features = false, features = ["axum", "vendored"] }

[build-dependencies]
tonic-prost-build = "0.14"
