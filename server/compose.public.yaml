services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      SLOPIFY_PUBLIC_IP: "${SLOPIFY_PUBLIC_IP:?Set SLOPIFY_PUBLIC_IP for public HTTPS}"
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
